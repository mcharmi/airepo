<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reputation Agent</title><style>
body{font-family:system-ui,sans-serif;margin:0;background:#f6f7f9;color:#16181d}.layout{display:grid;grid-template-columns:260px 1fr;min-height:100vh}.sidebar{background:#fff;border-right:1px solid #e5e7eb;padding:20px 12px;position:sticky;top:0;height:100vh;box-sizing:border-box;overflow-y:auto}.menuBtn{display:none;position:fixed;top:12px;left:12px;z-index:30;background:#fff;color:#111827;border:1px solid #e5e7eb;font-size:22px;padding:7px 11px}.overlay{display:none}.version{position:fixed;right:10px;bottom:8px;font-size:11px;color:#8a919c;background:rgba(255,255,255,.9);padding:3px 6px;border-radius:6px;z-index:20}.sidebar h3{padding:0 8px}.campaignItem{display:flex;gap:6px;align-items:center;margin:5px 0}.campaignItem button:first-child{flex:1;text-align:left;background:transparent;color:#111827}.campaignItem.active button:first-child{background:#eef2ff}.campaignItem .delete{background:transparent;color:#9ca3af;padding:8px}.wrap{max-width:1100px;margin:40px auto;padding:0 18px;width:calc(100% - 36px)}h1{margin-bottom:4px}.muted{color:#67707d}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{background:white;border:1px solid #e5e7eb;border-radius:14px;padding:18px;margin:14px 0}label{display:block;font-size:13px;margin:10px 0 4px}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ccd1d8;border-radius:8px}button{padding:10px 14px;border:0;border-radius:8px;background:#111827;color:white;cursor:pointer}.secondary{background:#e9edf2;color:#111}.case{border-top:1px solid #eee;padding:12px 0}.pill{font-size:12px;padding:3px 7px;border-radius:999px;background:#eef2ff}.ok{background:#eaf8ef}.errorBox{display:none;background:#fff1f2;border:1px solid #fecdd3;color:#9f1239;border-radius:10px;padding:12px 14px;margin:14px 0}.errorBox.show{display:block}pre{white-space:pre-wrap}@media(max-width:760px){.layout{display:block}.menuBtn{display:block}.sidebar{position:fixed;z-index:40;left:0;top:0;width:280px;height:100vh;transform:translateX(-100%);transition:transform .2s ease;border-right:1px solid #e5e7eb}.sidebar.open{transform:translateX(0)}.overlay.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:35}.wrap{margin-top:64px}.grid{grid-template-columns:1fr}}
</style></head><body><button class="menuBtn" id="menuBtn" aria-label="Menü öffnen">☰</button><div class="overlay" id="overlay"></div><div class="layout"><aside class="sidebar" id="sidebar"><h3>Suchen</h3><div id="campaigns"></div></aside><main class="wrap"><h1>Reputation Agent</h1><div class="muted">MVP: Kampagne → Import → Vorprüfung → Freigabe → Auftrag + Vollmacht → manueller Removal-Handoff</div>
<div class="grid"><div class="card"><h2>Kampagne</h2><form id="campaign"><label>Name</label><input name="name" value="Zahnärzte NRW"><label>Branche</label><input name="industry" value="Zahnarzt"><label>Bundesland / Region</label><input name="state" value="Nordrhein-Westfalen"><label>Max. Sterne der Zielbewertung</label><input name="maxStars" type="number" min="1" max="5" value="2"><label>Mindestanzahl Profilbewertungen</label><input name="minReviewCount" type="number" value="5"><button type="button" id="search">Fälle suchen</button> <button type="button" class="secondary" id="demo">Demo laden</button></form></div>
<div class="card"><h2>Datenimport</h2><p class="muted">JSON-Zeilen importieren. Für Live-Betrieb können Daten aus einem externen Google-Review-Datenanbieter hier eingespeist werden.</p><textarea id="rows" rows="10">[{"businessName":"Praxis Beispiel GmbH","website":"https://example.org","email":"kontakt@example.org","profileRating":4.7,"totalReviews":124,"rating":1,"text":"Ich war nie Kunde und kenne die Praxis nicht.","reviewUrl":"https://example.org/review"}]</textarea><button id="import">In aktive Kampagne importieren</button></div></div>
<div id="errorBox" class="errorBox"></div><div class="card"><h2>Fälle</h2><div id="cases"></div></div></main></div><div class="version">v0.6.0</div><script>
function reportError(context,error,details){const message=error?.message||String(error||"Unbekannter Fehler");console.error("[Reputation Agent]",context,{message,error,details});const box=document.querySelector("#errorBox");if(box){box.textContent=context+": "+message;box.classList.add("show")}}
async function api(url,options){try{const r=await fetch(url,options);let data;try{data=await r.json()}catch{data={message:"Ungültige API-Antwort (HTTP "+r.status+")"}}if(!r.ok){const e=new Error(data.message||data.error||("HTTP "+r.status));e.status=r.status;e.response=data;throw e}return data}catch(e){reportError((options?.method||"GET")+" "+url,e,e.response);throw e}}
window.addEventListener("error",e=>reportError("JavaScript-Fehler",e.error||e.message));window.addEventListener("unhandledrejection",e=>reportError("Unbehandelter Promise-Fehler",e.reason));
let activeCampaign=null;
async function state(){
  const s=await api('/api/state');
  if(!activeCampaign&&s.campaigns.length)activeCampaign=s.campaigns.at(-1).id;
  document.querySelector('#campaigns').innerHTML=s.campaigns.slice().reverse().map(c=>`<div class="campaignItem ${c.id===activeCampaign?'active':''}"><button onclick="selectCampaign('${c.id}')"><b>${esc(c.name)}</b><br><small>${esc(c.industry)} · ${esc(c.state)}</small></button><button class="delete" title="Löschen" onclick="deleteCampaign('${c.id}',event)">×</button></div>`).join('')||'<span class="muted">Noch keine Suchen.</span>';
  const visible=s.cases.filter(c=>c.campaignId===activeCampaign).slice().reverse();
  document.querySelector('#cases').innerHTML=visible.map(c=>`<div class="case"><b>${esc(c.business.name)}</b> <span class="pill ${c.review.qualification.candidate?'ok':''}">${esc(c.status)}</span><div>${c.review.rating}★ · ${esc(c.review.text)}</div><div class="muted">${esc(c.review.qualification.summary)}</div>${c.status==='needs_review'?`<button onclick="approve('${c.id}')">Ansprache freigeben</button>`:''}${c.outreachDraft?`<details><summary>E-Mail-Entwurf</summary><pre>${esc(c.outreachDraft.text)}</pre></details>`:''}</div>`).join('')||'<span class="muted">Noch keine Fälle.</span>';
}
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
document.querySelector('#campaign').onsubmit=async e=>{
  e.preventDefault();
  const f=new FormData(e.target);
  const body={name:f.get('name'),industry:f.get('industry'),state:f.get('state'),reviewFilters:{maxStars:+f.get('maxStars'),minReviewCount:+f.get('minReviewCount')}};
  const c=await fetch('/api/campaigns',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)}).then(r=>r.json());
  activeCampaign=c.id;state();
};
document.querySelector('#search').onclick=async()=>{
  const b=document.querySelector('#search');b.disabled=true;b.textContent='Suche läuft…';
  try{
    const form=document.querySelector('#campaign');
    const f=new FormData(form);
    const body={name:f.get('name'),industry:f.get('industry'),state:f.get('state'),reviewFilters:{maxStars:+f.get('maxStars'),minReviewCount:+f.get('minReviewCount')}};
    const cr=await fetch('/api/campaigns',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});
    const c=await cr.json();
    if(!cr.ok)throw new Error(c.message||c.error||'Kampagne konnte nicht erstellt werden');
    activeCampaign=c.id;
    const r=await fetch(`/api/campaigns/${activeCampaign}/search`,{method:'POST'});
    const x=await r.json();
    if(!r.ok)throw new Error(x.message||x.error||'Suche fehlgeschlagen');
    alert(`${x.imported} Fälle gefunden · Modus: ${x.mode}`);
    state();
  }catch(e){reportError('Suche fehlgeschlagen',e);alert(e.message)}finally{b.disabled=false;b.textContent='Fälle suchen'}
};
document.querySelector('#demo').onclick=async()=>{const d=await fetch('/api/demo',{method:'POST'}).then(r=>r.json());activeCampaign=d.campaign.id;state()};
document.querySelector('#import').onclick=async()=>{
  if(!activeCampaign)return alert('Zuerst Kampagne erstellen');
  let rows;try{rows=JSON.parse(document.querySelector('#rows').value)}catch{return alert('Ungültiges JSON')}
  await fetch(`/api/campaigns/${activeCampaign}/import`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({rows})});state();
};
function closeMenu(){document.querySelector('#sidebar').classList.remove('open');document.querySelector('#overlay').classList.remove('open')}
document.querySelector('#menuBtn').onclick=()=>{document.querySelector('#sidebar').classList.toggle('open');document.querySelector('#overlay').classList.toggle('open')};
document.querySelector('#overlay').onclick=closeMenu;
window.selectCampaign=id=>{activeCampaign=id;closeMenu();state()};
window.deleteCampaign=async(id,e)=>{
  e.stopPropagation();
  if(!confirm('Diese Suche und alle zugehörigen Fälle löschen?'))return;
  const r=await fetch('/api/campaigns/'+id,{method:'DELETE'});
  if(!r.ok){const x=await r.json().catch(()=>({}));reportError('Löschen fehlgeschlagen',new Error(x.message||x.error||('HTTP '+r.status)),x);return alert(x.message||x.error||'Löschen fehlgeschlagen')}
  if(activeCampaign===id)activeCampaign=null;
  state();
};
window.approve=async id=>{try{const x=await api(`/api/cases/${id}/approve-outreach`,{method:'POST'});await navigator.clipboard?.writeText(x.draft?.text||'');state()}catch(e){reportError('Ansprache konnte nicht freigegeben werden',e)}};
state().catch(e=>reportError('Initialisierung fehlgeschlagen',e));
</script></body></html>
