name: production health monitor

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/production-monitor.yml"
  schedule:
    - cron: "*/15 * * * *"

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Check public health endpoint
        run: |
          BODY=$(curl --fail --silent --show-error --max-time 15             https://agent-sign-guard-main-production.up.railway.app/health)
          echo "$BODY"
          node -e '
            const body = JSON.parse(process.argv[1]);
            if (body.ok !== true) throw new Error("service not healthy");
            if (body.service !== "agent-sign-guard") throw new Error("unexpected service");
            if (body.version !== "0.6.0") throw new Error("unexpected version");
            if (body.x402 !== true) throw new Error("x402 not enabled");
            if (body.simulation !== true) throw new Error("EVM simulation not enabled");
            if (body.sanctions?.fresh !== true) throw new Error("sanctions data not fresh");
            if (!(body.sanctions?.count > 0)) throw new Error("sanctions set empty");
          ' "$BODY"

      - name: Check metrics endpoint
        run: |
          BODY=$(curl --fail --silent --show-error --max-time 15             https://agent-sign-guard-main-production.up.railway.app/metrics)
          echo "$BODY"
          node -e '
            const body = JSON.parse(process.argv[1]);
            if (body.service !== "agent-sign-guard") throw new Error("unexpected metrics service");
            if (body.version !== "0.6.0") throw new Error("unexpected metrics version");
            if (typeof body.requests_total !== "number") throw new Error("missing request counter");
            if (typeof body.rate_limited_total !== "number") throw new Error("missing rate-limit counter");
          ' "$BODY"

      - name: Check discovery endpoints
        run: |
          curl --fail --silent --show-error --max-time 15 \
            https://agent-sign-guard-main-production.up.railway.app/llms.txt \
            | grep -qi "EVM transaction risk API"
          curl --fail --silent --show-error --max-time 15 \
            https://agent-sign-guard-main-production.up.railway.app/.well-known/x402 \
            | node -e '
              let s="";
              process.stdin.on("data", c => s += c);
              process.stdin.on("end", () => {
                const body = JSON.parse(s);
                if (body.protocol !== "x402") throw new Error("x402 manifest missing");
                if (!body.tags?.includes("permit2")) throw new Error("discovery tags missing");
              });
            '
          curl --fail --silent --show-error --max-time 15 \
            https://agent-sign-guard-main-production.up.railway.app/transparency \
            > /dev/null
