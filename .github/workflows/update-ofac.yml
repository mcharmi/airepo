name: update OFAC sanctions snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-ofac.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: node scripts/update-ofac-snapshot.js
      - name: Commit updated snapshot
        run: |
          if git diff --quiet -- data/ofac-sdn-evm.json; then
            echo "No OFAC snapshot changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ofac-sdn-evm.json
          git commit -m "Update OFAC SDN EVM snapshot"
          git push
