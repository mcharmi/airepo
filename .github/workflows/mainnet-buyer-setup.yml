name: mainnet buyer setup

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/mainnet-buyer-setup.yml"
      - "scripts/mainnet-buyer-address.js"
  workflow_dispatch:

jobs:
  buyer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CDP_API_KEY_ID: ${{ secrets.CDP_API_KEY_ID }}
      CDP_API_KEY_SECRET: ${{ secrets.CDP_API_KEY_SECRET }}
      CDP_WALLET_SECRET: ${{ secrets.CDP_WALLET_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Provision mainnet x402 buyer address
        run: node scripts/mainnet-buyer-address.js
